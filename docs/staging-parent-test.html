<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CarOne — Isolated Parent Test Harness (STAGING ONLY)</title>
<!--
  ISOLATED STAGING TEST PARENT — NOT FOR PRODUCTION, NOT A WORDPRESS PAGE.

  Purpose: stand in for the WordPress parent while there is no WP staging site.
  It embeds the STAGING booking form, runs the proposed parent listener, validates
  origin + event source, shows every dataLayer push on-screen, and "redirects" only
  inside this page (no navigation to car-one.com.au).

  CONTAINS NO PRODUCTION GOOGLE TAGS. There is deliberately no gtag.js, no GTM
  snippet, no Google Ads, no GA4. dataLayer here is a LOCAL array this page owns,
  so a confirmed booking fires nothing to Google. Use GTM Preview separately to
  inspect tag behaviour against this same dataLayer.

  Serve it locally only, e.g.:  npx serve docs   (then open /staging-parent-test.html)
-->
<style>
  :root { --fg:#111; --bg:#fff; --muted:#666; --line:#e3e3e3; --accent:#ff4d24; --ok:#0a7d32; --warn:#b26a00; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fg:#e8e8e8; --bg:#141414; --muted:#9a9a9a; --line:#2a2a2a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; color:var(--fg); background:var(--bg); }
  header { padding:12px 16px; border-bottom:1px solid var(--line); }
  header b { color:var(--accent); }
  .wrap { display:grid; grid-template-columns:1fr 420px; gap:16px; padding:16px; }
  @media (max-width:860px){ .wrap{ grid-template-columns:1fr; } }
  .panel { border:1px solid var(--line); border-radius:12px; padding:12px; min-width:0; }
  .panel h2 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  button.open { background:var(--accent); color:#fff; border:0; border-radius:999px; padding:10px 18px; cursor:pointer; }
  iframe { width:100%; height:640px; border:1px solid var(--line); border-radius:12px; background:#fff; }
  #log { font:12px/1.45 ui-monospace,Menlo,monospace; white-space:pre-wrap; word-break:break-word; max-height:560px; overflow:auto; }
  .evt { padding:8px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; }
  .evt.ok { border-color:var(--ok); }
  .evt.warn { border-color:var(--warn); }
  .cfg { font:12px/1.4 ui-monospace,monospace; color:var(--muted); }
  code { background:rgba(127,127,127,.15); padding:0 4px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <b>CarOne staging parent test harness</b> — isolated · no production Google tags ·
  redirects stay on this page
</header>

<div class="wrap">
  <div class="panel">
    <h2>Embedded staging booking form</h2>
    <p class="cfg">
      Form origin: <code id="cfgOrigin"></code><br />
      Set it below before testing. It MUST be the staging form, never
      <code>embed.car-one.com.au</code>.
    </p>
    <p>
      <input id="formUrl" style="width:60%;padding:6px" placeholder="https://&lt;staging-form&gt;.vercel.app" />
      <button class="open" id="loadBtn">Load form</button>
    </p>
    <div id="frameHost"></div>
  </div>

  <div class="panel">
    <h2>dataLayer inspector (local — fires nothing to Google)</h2>
    <div id="log"></div>
  </div>
</div>

<!-- Local, page-owned dataLayer. No GTM/gtag reads or writes it. -->
<script>
(function () {
  'use strict';

  // ── Config: STAGING origins only. Fill these in before testing. ──────────────
  // EMBED_ORIGIN must exactly match the staging form's origin (scheme+host+port).
  var EMBED_ORIGIN = localStorage.getItem('carone_test_embed_origin') || ''; // e.g. https://carone-booking-form-test.vercel.app
  var ISOLATED_THANKYOU = '#thank-you-test'; // in-page only; never car-one.com.au

  var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  var ALLOWED_WORKSHOPS = ['hendra', 'woolloongabba'];
  var ALLOWED_ENTRY = ['paid_landing', 'main_site', 'direct', 'gbp', 'other_embed'];

  window.dataLayer = window.dataLayer || [];
  var logEl = document.getElementById('log');
  var frameHost = document.getElementById('frameHost');
  var iframe = null;

  function log(kind, title, obj) {
    var div = document.createElement('div');
    div.className = 'evt' + (kind ? ' ' + kind : '');
    div.textContent = '[' + new Date().toISOString().slice(11, 19) + '] ' + title +
      (obj ? '\n' + JSON.stringify(obj, null, 2) : '');
    logEl.prepend(div);
  }

  function normaliseService(s) {
    return String(s || '').trim().toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '').slice(0, 60);
  }
  function ack(source, ref) {
    try { source.postMessage({ type: 'carone_booking_ack', booking_reference: ref }, EMBED_ORIGIN); } catch (e) {}
  }

  // One-time registration guard (mirrors the production listener).
  if (!window.__caroneBookingListenerRegistered) {
    window.__caroneBookingListenerRegistered = true;

    window.addEventListener('message', function (event) {
      // Resize/close chrome signals are allowed through for layout parity, logged only.
      if (event.data && (event.data.type === 'carone-resize' || event.data === 'carone-booking-close')) {
        log('', 'chrome signal', typeof event.data === 'string' ? { data: event.data } : event.data);
        return;
      }
      if (!EMBED_ORIGIN) { log('warn', 'rejected: EMBED_ORIGIN not configured'); return; }
      if (event.origin !== EMBED_ORIGIN) { log('warn', 'rejected: wrong origin', { got: event.origin, want: EMBED_ORIGIN }); return; }
      var d = event.data;
      if (!d || d.type !== 'carone_booking_request_submitted') return;
      if (!iframe || event.source !== iframe.contentWindow) { log('warn', 'rejected: event.source is not the booking iframe'); return; }

      var ref = String(d.booking_reference || '');
      if (!UUID_RE.test(ref)) { log('warn', 'rejected: malformed booking_reference', { ref: ref.slice(0, 12) + '…' }); return; }
      var workshop = String(d.workshop || '');
      if (ALLOWED_WORKSHOPS.indexOf(workshop) === -1) { log('warn', 'rejected: unknown workshop', { workshop: workshop }); return; }
      var entry = String(d.booking_entry_point || 'direct');
      if (ALLOWED_ENTRY.indexOf(entry) === -1) entry = 'other_embed';
      var service = normaliseService(d.service_type);

      var KEY = 'carone_booked_' + ref;
      try {
        if (sessionStorage.getItem(KEY)) { log('ok', 'duplicate acked, NOT re-pushed', { ref: ref }); ack(event.source, ref); return; }
        sessionStorage.setItem(KEY, '1');
      } catch (e) {}

      window.dataLayer.push({
        event: 'booking_request_submitted',
        booking_reference: ref,
        workshop: workshop,
        service_type: service,
        booking_entry_point: entry,
        landing_page_type: String(d.landing_page_type || 'none')
      });
      log('ok', 'dataLayer.push booking_request_submitted (LOCAL — no Google request sent)', window.dataLayer[window.dataLayer.length - 1]);

      ack(event.source, ref);

      if (entry === 'paid_landing') {
        // Isolated redirect: in-page hash only. NEVER navigates to car-one.com.au.
        log('', 'paid_landing → isolated in-page redirect ' + ISOLATED_THANKYOU);
        location.hash = ISOLATED_THANKYOU;
      }
    }, false);
  }

  // ── Harness controls ─────────────────────────────────────────────────────────
  document.getElementById('cfgOrigin').textContent = EMBED_ORIGIN || '(not set)';
  document.getElementById('formUrl').value = localStorage.getItem('carone_test_form_url') || '';
  document.getElementById('loadBtn').addEventListener('click', function () {
    var url = document.getElementById('formUrl').value.trim().replace(/\/$/, '');
    if (!url) { alert('Enter the staging form URL first.'); return; }
    try {
      EMBED_ORIGIN = new URL(url).origin;
      if (EMBED_ORIGIN.indexOf('embed.car-one.com.au') !== -1) { alert('Refusing: that is the PRODUCTION origin.'); return; }
    } catch (e) { alert('Invalid URL'); return; }
    localStorage.setItem('carone_test_form_url', url);
    localStorage.setItem('carone_test_embed_origin', EMBED_ORIGIN);
    document.getElementById('cfgOrigin').textContent = EMBED_ORIGIN;
    frameHost.innerHTML = '';
    iframe = document.createElement('iframe');
    iframe.title = 'Staging booking form';
    iframe.src = url + (url.includes('?') ? '&' : '?') + 'parent_url=' + encodeURIComponent(location.href) + '&utm_source=qa_harness';
    frameHost.appendChild(iframe);
    log('', 'loaded staging form', { origin: EMBED_ORIGIN });
  });

  log('', 'harness ready — NO production Google tags present on this page');
})();
</script>
</body>
</html>
